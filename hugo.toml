baseURL = "http://localhost:1313/"
languageCode = "en-us"
title = "Science Serves"
theme = "hugo-fresh"

# Hugo Modules configuration
[module]
  [[module.imports]]
    path = "github.com/StefMa/hugo-fresh"
  [[module.imports]]
    path = "github.com/jgthms/bulma"

[params]
  fontawesome_version = "6.1.2"
  customCSS = ["/css/custom.css"]
  
  [params.font]
    name = "Open Sans"
    sizes = [400, 600]
  
  # Logo and branding
  [params.hero]
    title = "Center for Science, Service, and Solidarity"
    subtitle = "Science for the Common Good"
    #buttontext = "Get Started"
    #buttonlink = "#features"
    image = "illustrations/hero.jpg"

  # Navigation
  [params.navbarlogo]
    image = "images/logo.png"
    link = "/"
  
  [[params.navbar]]
    title = "Mission"
    url = "/#section1"
  
  [[params.navbar]]
    title = "About"
    url = "/#section2"
  
  [[params.navbar]]
    title = "Maps"
    url = "/maps"
  
  [[params.navbar]]
    title = "Contact"
    url = "/#section4"

  # Section 1 - Mission
  [params.section1]
    title = "Our Mission"
    subtitle = "The way we approach our work"
    
    [[params.section1.tiles]]
      title = "Community-Driven Solutions"
      icon = "users"
      subtitle = "Deep Listening, Shared Learning"
	  text = "We center our work on community priorities, listening deeply to those most harmed, and support community-led solutions that arise from lived experience and local expertise. We believe in participation, transparency, and shared power."
     #url = "#"
      #buttonText = "Learn more"
    
    [[params.section1.tiles]]
      title = "Building Equitable Futures"
      icon = "chart-line"
      subtitle = "Dismantling Barriers & Creating Opportunities"
	  text = "We translate insights into action, building equitable futures by dismantling barriers and creating opportunities. We support communities in shaping their environments, advocating for change, and building thriving futures."
      #url = "#"
      #buttonText = "Learn more"
    
    [[params.section1.tiles]]
      title = "Justice & Solidarity"
      icon = "balance-scale"
      subtitle= "Supporting Agency & Self-Determination"
	  text = "We challenge the status quo, grounding our work in solidarity and justice. We're committed to building a world where communities are self-sufficient, resilient, and have the agency to shape their own destinies."
      #url = "#"
      #buttonText = "Learn more"

  # Section 2 - About
  [params.section2]
    title = "About Us"
    subtitle = "The Center for Science, Service, and Solidarity (CS³) is a values-driven organization committed to making knowledge and tools accessible for the common good. We believe that data, science, and community wisdom can be powerful forces for change when combined with a commitment to justice. We provide strategic advising and training, advocate for policies that advance equity and resilience, and partner with communities to help them identify, design, and implement solutions."
    
    [[params.section2.features]]
      title = "Collaborative Research"
      text = "Co-designing research with communities, for local solutions."
      icon = "laptop-code"
    
    [[params.section2.features]]
      title = "Strategic Advising"
      text = "Guiding advocacy, supporting infrastructure, and systems navigation."
      icon = "technical"
    
    [[params.section2.features]]
      title = "Accessible Training"
      text = "Building community capacity, sharing knowledge & skills."
      icon = "education"
	
  	[[params.section2.features]]
      title = "Community Leadership"
      text = "Supporting emerging leaders for equity and justice."
      icon = "mentoring"
	  
	[[params.section2.features]]
      title = "Advocacy & Systems Change"
      text = "Helping communities dismantle systemic barriers and build healthier systems."
      icon = "tools"
	  


# Section 3 - Maps Teaser
  [params.section3]
    title = "Interactive Maps"
    subtitle = "Explore our data visualizations."
    
    # This is the image file you need to put in static/images/
    image = "map-preview.png" 
    
    # The Button
    buttontext = "View All Maps"
    
    # This links to your new page (we will create this next)
    buttonlink = "/maps"

  # Section 4 - Contact/Call to Action
  [params.section4]
    title = "Get in Touch"
    subtitle = "Interested in collaborating or learning more about our work? We'd love to hear from you."
    buttontext = "Contact Us"
    buttonlink = "mailto:info@scienceserves.org"

  # Footer Configuration
  [params.footer]
    logo = "logo.svg" # Make sure this file is in static/images/logos/
    socialmediatitle = "Follow Us"

    # --- THIS IS YOUR NEW CREDITS SECTION ---
    [[params.footer.quicklinks]]
      title = "Image Credits"
      
	[[params.footer.quicklinks.links]]
      text = "**Illustration** by pch.vector / Freepik"
      link = "http://www.freepik.com"

[[params.footer.quicklinks.links]]
      text = "**About Us Photo** by Jopwell / Pexels"
      link = "https://www.pexels.com/photo/women-and-man-on-sofa-2422288/"

      [[params.footer.quicklinks.links]]
        text = "Icons via IconStore"
        link = "https://iconstore.co"
    # ----------------------------------------

    # Social Media Links (Keep these as you have them)
    [[params.footer.socialmedia]]
      link = "https://github.com/scienceserves"
      icon = "github"
    
    [[params.footer.socialmedia]]
      link = "https://linkedin.com/in/kristi-pullen-fedinick"
      icon = "linkedin"