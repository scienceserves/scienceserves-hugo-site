<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
  <head>
    {{ partial "meta.html" . }}
    <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
    
    <!-- Load theme CSS first -->
    {{ partial "css.html" . }}
    
    <!-- CRITICAL: Add your custom CSS link here (MUST be after theme CSS) -->
    <link rel="stylesheet" href="/css/custom.css">
    
    {{ partial "custom-head.html" . }}
  </head>
  
  <body>
     {{ if ne .Site.Params.preloader false }}
    <!-- Preloader -->
    <div id="preloader">
      <div id="status"></div>
    </div>
    {{ end }}

    {{ block "main" . }}
    {{ end }}

    <!-- Back To Top Button -->
    <div id="backtotop"><a href="#"></a></div>

    {{ partial "javascript.html" . }}
  </body>
</html>
