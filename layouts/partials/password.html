<!DOCTYPE html>
<html lang="en">
{{ partial "custom-head.html" . }} <body>
    {{ partial "navbar.html" . }}

    <section class="hero is-fullheight-with-navbar">
        <div class="hero-body">
            <div class="container">
                <div class="columns is-centered">
                    <div class="column is-5-tablet is-4-desktop is-3-widescreen">
                        
                        <div id="passwordFormContainer" class="box shadow-v1">
                            <h3 class="title is-4 has-text-centered">Restricted Access</h3>
                            <hr>
                            <form id="passwordForm" onsubmit="return checkPassword()">
                                <div class="field">
                                    <label class="label">Password</label>
                                    <div class="control">
                                        <input class="input is-medium" type="password" id="passcode" placeholder="••••••••" required>
                                    </div>
                                    <p id="error" class="help is-danger"></p>
                                </div>
                                <div class="field">
                                    <button type="submit" class="button is-primary is-fullwidth is-medium raised">Login</button>
                                </div>
                            </form>
                        </div>

                        <div id="content" style="display: none;">
                            <div class="content">
                                {{ .Content }}
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        function checkPassword() {
            const correctPassword = '{{ .Params.password }}';
            const input = document.getElementById('passcode').value;

            if (input === correctPassword) {
                document.getElementById('passwordFormContainer').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                return false;
            } else {
                const errorEl = document.getElementById('error');
                errorEl.textContent = 'Incorrect password. Please try again.';
                document.getElementById('passcode').classList.add('is-danger');
                return false;
            }
        }
    </script>

    {{ partial "footer.html" . }}
</body>
</html>
